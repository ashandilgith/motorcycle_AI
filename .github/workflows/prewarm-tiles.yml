# Fill the road-tile cache from GitHub's servers and commit the tiles, so Render redeploys with them.
# Run it from GitHub: Actions > "Prewarm road tiles" > Run workflow (enter the area), or:
#   gh workflow run prewarm-tiles.yml -f around=14.6240,121.2064 -f km=3
name: Prewarm road tiles
on:
  workflow_dispatch:
    inputs:
      around:
        description: "Centre as lat,lon"
        default: "14.6240,121.2064"
        required: true
      km:
        description: "Radius in km"
        default: "3"
        required: true

permissions:
  contents: write

concurrency: prewarm-tiles

jobs:
  prewarm:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r backend/requirements.txt
      - name: Download tiles
        working-directory: backend
        run: python -m tools.prewarm_osm --around "${{ inputs.around }}" --km "${{ inputs.km }}" --pause 5
      - name: Commit new tiles
        run: |
          git add backend/data/osm_tiles
          if git diff --cached --quiet; then echo "No new tiles"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Road tiles around ${{ inputs.around }} (${{ inputs.km }} km)"
          git pull --rebase
          git push
