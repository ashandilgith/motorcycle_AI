<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#0b0d10">
  <title>Moto AI · Curve alert</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/app.css">
</head>
<body data-level="none">
  <header class="bar">
    <span id="status" class="chip">Ready</span>
    <button id="wetBtn" class="chip toggle" aria-pressed="false" title="Force wet-road speeds">Dry</button>
    <button id="settingsBtn" class="icon" aria-label="Settings">⚙</button>
  </header>

  <main class="hud">
    <div class="speed"><span id="speed">--</span><small>km/h</small></div>
    <div id="banner" class="banner">Tap Start, then mount the phone</div>
    <div class="next">
      <div><label>Next curve</label><b id="nextDist">—</b></div>
      <div><label>Safe speed</label><b id="nextSafe">—</b></div>
    </div>
  </main>

  <footer class="actions">
    <button id="startBtn" class="primary">Start ride</button>
    <div class="row">
      <button id="demoBtn">Demo ride</button>
      <button id="testBtn">Test beeps</button>
    </div>
  </footer>

  <dialog id="settings">
    <form method="dialog">
      <h2>Settings</h2>
      <label>Alert sound
        <select id="soundMode">
          <option value="beeps">Beeps only (recommended)</option>
          <option value="both">Beeps + voice</option>
          <option value="voice">Voice only</option>
        </select>
      </label>
      <label>Voice language
        <select id="voiceLang">
          <option value="tl">Taglish</option>
          <option value="en">English</option>
        </select>
      </label>
      <label>Volume <input id="volume" type="range" min="0.2" max="1" step="0.1" value="1"></label>
      <label>Destination (optional, "lat, lon")
        <input id="destination" inputmode="decimal" placeholder="14.5547, 121.0244">
      </label>
      <p class="hint">No destination: follows the road ahead of you (OpenStreetMap). Keep the screen on and the app open while riding.</p>
      <menu><button value="close" class="primary">Done</button></menu>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
